[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everyseat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "numpy>=2.0", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
everyseat = "everyseat.cli:main"
everyseat-validate = "everyseat.contracts.cli:main"

[tool.setuptools.packages.find]
include = ["everyseat*"]
namespaces = false

[tool.setuptools.package-data]
"everyseat.contracts" = ["schemas/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
