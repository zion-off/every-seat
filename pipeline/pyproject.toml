[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everyseat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "botocore[crt]>=1.35",
  "jsonschema>=4.23",
  "numpy>=2.0",
  "pillow>=10.1",
  "sensevtt>=0.1.0",
  "strands-agents>=1.62",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
# What the cloud runtime container adds on top of the pipeline.
cloud = [
  "aws-opentelemetry-distro~=0.21.0",
  "bedrock-agentcore>=1.18.1,<2",
]

[project.scripts]
everyseat = "everyseat.cli:main"
everyseat-validate = "everyseat.contracts.cli:main"

[tool.setuptools.packages.find]
include = ["everyseat*"]
namespaces = false

[tool.setuptools.package-data]
"everyseat.contracts" = ["schemas/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
