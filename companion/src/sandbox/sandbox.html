<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Card sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        color-scheme: inherit;
      }
    </style>
  </head>
  <body>
    <script>
      // Hosts a card (an MCP app) for a page on another origin. The page and this document must
      // be different origins; the card runs in a nested frame and every message between the
      // page and the card passes through here.
      (() => {
        const PROXY_READY = "ui/notifications/sandbox-proxy-ready";
        const RESOURCE_READY = "ui/notifications/sandbox-resource-ready";

        if (window.self === window.top) throw new Error("This page only works inside a frame.");
        if (!document.referrer) throw new Error("No referrer, so the embedding page is unknown.");
        const host = new URL(document.referrer);
        // The page and the sandbox are served from the same machine, on different ports.
        if (host.hostname !== location.hostname) throw new Error("The embedding page is on another host.");
        const hostOrigin = host.origin;
        const ownOrigin = location.origin;
        if (hostOrigin === ownOrigin) throw new Error("The page and the sandbox must be different origins.");

        // Reading the top window must fail across origins; if it does not, isolation is broken.
        let isolated = false;
        try {
          void window.top.location.href;
        } catch {
          isolated = true;
        }
        if (!isolated) throw new Error("The sandbox is not isolated from the page.");

        const inner = document.createElement("iframe");
        inner.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
        document.body.appendChild(inner);

        window.addEventListener("message", (event) => {
          if (event.source === window.parent) {
            if (event.origin !== hostOrigin) return;
            const message = event.data;
            if (message && message.method === RESOURCE_READY) {
              const { html, sandbox } = message.params || {};
              if (typeof sandbox === "string") inner.setAttribute("sandbox", sandbox);
              if (typeof html === "string") {
                const doc = inner.contentDocument;
                doc.open();
                doc.write(html);
                doc.close();
              }
            } else if (inner.contentWindow) {
              inner.contentWindow.postMessage(message, "*");
            }
          } else if (event.source === inner.contentWindow) {
            if (event.origin !== ownOrigin) return;
            window.parent.postMessage(event.data, hostOrigin);
          }
        });

        window.parent.postMessage({ jsonrpc: "2.0", method: PROXY_READY, params: {} }, hostOrigin);
      })();
    </script>
  </body>
</html>
