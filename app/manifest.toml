schema-version = 1

[package]
id = "com.everyseat.app"
title = "Every Seat"
version = "0.1.0"
icon = "@image/EverySeat.png"

[os.version]
min = "1.2"
target = "1.2"

[components]

[[components.interactive]]
id = "com.everyseat.app.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
categories = [
    "com.amazon.category.main",
    "com.amazon.category.kepler.media"
]
launch-type = "singleton"

[processes]

[[processes.group]]
component-ids = ["com.everyseat.app.main"]

[wants]

[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.kepler.pcon.service.main"

[[wants.service]]
id = "com.amazon.drm.key"

[[wants.service]]
id = "com.amazon.drm.crypto"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.inputd.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

[[wants.service]]
id = "com.amazon.network.service"

[needs]

[[needs.privilege]]
id = "com.amazon.media.secureplayback"

[[needs.privilege]]
id = "com.amazon.privilege.security.file-sharing"

[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.epg_2@IEpg_8"

[[needs.module]]
id = "/com.amazon.kepler.native_ui_components_2@INativeUiComponents_13"

[[needs.module]]
id = "/com.amazon.kepler.linear_gradient_2@ILinearGradient_0"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_2@IKeplerScript_1"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[offers]

[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.interaction]]
id = "com.everyseat.app.main"

[[offers.module]]
id = "/com.everyseat.app.main@IMod1"
includes-messages = [
    "pkg://com.everyseat.app.main"
]

[[message]]
uri = "pkg://com.everyseat.app.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]
